appId: host.exp.exponent
---
# The app must already be signed in and opened to the Focus route.
- openLink: "exp://localhost:8081"
- waitForAnimationToEnd
- tapOn:
    text: "Focus"
- waitForAnimationToEnd
- assertVisible: "FOCUS ON ONE THING"
- assertVisible: "Focus"
- assertVisible: "Focus · 25 min"
- assertVisible: "Short break · 5 min"
- assertVisible: "Long break · 15 min"
- assertVisible: "Choose sound"
